name: Deploy to GitHub Pages

# Publishes the contents of dist/ at the site root, so the page opens at
# https://everythingispossibletrue.github.io/Landing/ instead of .../Landing/dist/.
# Requires Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: python3 scripts/build-seo.py

      - name: Keep old /dist/ links working
        run: |
          mkdir -p dist/dist
          cat > dist/dist/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8" />
          <title>Дарья Хамидуллина</title>
          <link rel="canonical" href="../" />
          <meta http-equiv="refresh" content="0; url=../" />
          <script>
            location.replace("../" + location.search + location.hash);
          </script>
          <a href="../">Открыть сайт</a>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
